<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#131417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Training Log</title>
<style>
:root{
  --bg:#edefe8;           /* warm sage-tinted paper */
  --surface:#f7f8f3;
  --surface2:#f1f3ec;
  --border:#d7dacd;
  --ink:#2c302a;
  --dim:#68705f;
  --faint:#98a08f;
  --accent:#3c6b4e;       /* forest green: actions, graph */
  --accent-ink:#f6f8f3;   /* text on accent */
  --cheat:#b04a3e;        /* below range minimum */
  --hit:#2e7d4f;          /* clean set at top of rep range */
  --blue:#42708f;         /* volume graph */
  --radius:10px;
}
body[data-theme="dark"]{
  --bg:#131417;
  --surface:#1c1e23;
  --surface2:#22252b;
  --border:#2b2e36;
  --ink:#e9e7e0;
  --dim:#8f95a0;
  --faint:#5d626c;
  --accent:#e2b13c;
  --accent-ink:#191504;
  --cheat:#c9564a;
  --hit:#7da87b;
  --blue:#6f9bbf;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}

/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 2px 16px}
header h1{font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
header .sub{font-size:.72rem;color:var(--faint);letter-spacing:.08em;margin-top:2px}
.back{
  background:none;border:1px solid var(--border);color:var(--dim);
  border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;flex:none;
}
.spacer{flex:1}

/* buttons */
button{font-family:inherit}
.btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:10px 14px;font-size:.85rem;cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:6px 10px;font-size:.78rem}
.btn.ghost{background:none;color:var(--dim)}
.btn.danger{color:var(--cheat);border-color:#4a2f2c}
.btn:active{opacity:.75}

/* workout list (home) */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;cursor:pointer;
}
.card h2{font-size:1rem;font-weight:700}
.card .meta{font-size:.78rem;color:var(--dim);margin-top:4px}
.card .chev{float:right;color:var(--faint)}

/* exercise cards */
.ex{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.ex-head{padding:13px 14px;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.ex-head b{font-size:.95rem}
.ex-head .target{font-size:.75rem;color:var(--dim);white-space:nowrap}
.ex-head .flag{
  margin-left:auto;font-size:.66rem;color:var(--accent);border:1px solid #4d3d17;
  border-radius:20px;padding:2px 8px;white-space:nowrap;letter-spacing:.04em;
}
.latest{padding:0 14px 12px;font-size:.85rem;line-height:1.5;color:var(--ink)}
.latest .date{font-size:.68rem;color:var(--faint);display:block;margin-bottom:2px}
.empty-note{color:var(--faint);font-style:italic;font-size:.8rem}

/* expanded history */
.hist{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface2)}
.hline{font-size:.85rem;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.hline .d{color:var(--faint);font-size:.66rem;margin-right:8px}
.set-low{color:var(--cheat)}
.set-hit{color:var(--hit)}
.ast{color:var(--dim)}
.note-tok{color:var(--dim);font-style:italic}
.today-row{display:flex;align-items:flex-start;gap:6px}
.today-row .hline{flex:1}
.pencil{background:none;border:none;color:var(--dim);font-size:.9rem;cursor:pointer;padding:4px}

/* logger */
.logger{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface)}
.logger .row{display:flex;gap:8px;margin-bottom:8px}
.logger input[type=number]{
  width:0;flex:1;background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:10px;font-size:1rem;text-align:center;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
.logger input::placeholder{color:var(--faint)}
.toggle{
  flex:none;width:44px;background:var(--bg);border:1px solid var(--border);color:var(--dim);
  border-radius:8px;font-size:1.05rem;cursor:pointer;
}
.toggle.on{color:var(--cheat);border-color:var(--cheat)}
.logger .row2{display:flex;gap:8px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--surface)}

/* editors */
textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:10px;font-size:.85rem;line-height:1.7;min-height:120px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
.editor{padding:12px 14px;border-top:1px solid var(--border);background:var(--surface2)}
.editor .hint{font-size:.72rem;color:var(--faint);margin:6px 0 8px;line-height:1.5}
.editor .row{display:flex;gap:8px;margin-top:8px}

/* graph */
.graph-wrap{border-top:1px solid var(--border);background:var(--surface2);padding:12px 8px 6px}
.graph-tabs{display:flex;gap:8px;padding:0 6px 10px}
.gtab{
  background:none;border:1px solid var(--border);color:var(--dim);border-radius:20px;
  padding:5px 12px;font-size:.74rem;cursor:pointer;letter-spacing:.03em;
}
.gtab.on{color:var(--ink);border-color:var(--dim)}
svg text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:9px;fill:var(--faint)}


/* plan manager */
.plan-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.plan-title{display:flex;align-items:center;gap:8px;font-size:.95rem}
.plan-badge{font-size:.66rem;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:2px 7px}
.plan-card .meta{font-size:.75rem;color:var(--dim);margin-top:4px}
.plan-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

/* linked exercise reference */
.linked-panel{border-top:1px solid var(--border);padding:10px 14px;background:var(--surface2)}
.linked-label{font-size:.68rem;color:var(--faint);letter-spacing:.04em;margin-bottom:5px}

/* misc */
.section-label{
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:22px 2px 10px;
}
.footer-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.legend{font-size:.74rem;color:var(--faint);line-height:1.8;margin-top:18px;padding:0 2px}
.legend .mono{color:var(--dim)}
dialog{border:none;background:transparent;max-width:100%}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border);color:var(--ink);
  padding:10px 18px;border-radius:20px;font-size:.8rem;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:99;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
"use strict";
/* ============================================================
   Data
   ============================================================ */
const KEY = "joshTrainingLog.v1";
const SCHEMA = 2;
let storageOK = true;
let data = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function normName(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }

const KNOWN_LINKS = new Map([
  ["leg press","leg_press"],
  ["chest press machine","chest_press_machine"],
  ["seated row","seated_row"],
  ["lat pulldown","lat_pulldown"],
  ["leg curl","leg_curl"],
  ["lateral raise","lateral_raise"],
  ["rear-delt machine","rear_delt_machine"],
  ["biceps curl (preacher/machine)","preacher_machine_curl"],
  ["one-arm triceps pushdown","one_arm_triceps_pushdown"],
  ["calf raise (squat machine)","calf_raise_squat_machine"],
  ["incline press machine","incline_press_machine"],
  ["leg extension","leg_extension"],
  ["overhead triceps extension","overhead_triceps_extension"],
  ["incline / hammer curl","incline_hammer_curl"],
  ["shrugs","shrugs"],
  ["incline dumbbell press","incline_dumbbell_press"],
  ["single-arm cable rear-delt fly","single_arm_cable_rear_delt_fly"],
]);

function knownLinkGroup(name){ return KNOWN_LINKS.get(normName(name)) || null; }

function allExercises(d=data){
  const out=[];
  if(!d || !Array.isArray(d.plans)) return out;
  for(const p of d.plans) for(const w of (p.workouts||[])) for(const ex of (w.exercises||[]))
    out.push({plan:p, workout:w, ex});
  return out;
}

function inferredLinkGroup(name, excludeId=null){
  const known = knownLinkGroup(name);
  if(known) return known;
  const match = allExercises().find(x=>x.ex.id!==excludeId && normName(x.ex.name)===normName(name) && x.ex.linkGroup);
  return match ? match.ex.linkGroup : "custom_"+uid();
}

function mkExercise(name,target,linkGroup=null){
  return {id:uid(), name, target, linkGroup:linkGroup || knownLinkGroup(name) || "custom_"+uid(), sessions:[]};
}

function makeTwoDayPlan(){
  return { id:uid(), name:"2-Day Weekend Plan", workouts:[
    { id:uid(), name:"Day A", exercises:[
      mkExercise("Leg press","4 x 6-8"),
      mkExercise("Chest press machine","4 x 6-8"),
      mkExercise("Seated row","4 x 6-8"),
      mkExercise("Lat pulldown","4 x 6-8"),
      mkExercise("Leg curl","3 x 8-10"),
      mkExercise("Lateral raise","3 x 10-12"),
      mkExercise("Rear-delt machine","3 x 10-12"),
      mkExercise("Biceps curl (preacher/machine)","3 x 8-10"),
      mkExercise("One-arm triceps pushdown","3 x 8-10"),
      mkExercise("Calf raise (squat machine)","3 x 12-15"),
    ]},
    { id:uid(), name:"Day B", exercises:[
      mkExercise("Leg press","4 x 6-8"),
      mkExercise("Incline press machine","4 x 6-8"),
      mkExercise("Seated row","4 x 6-8"),
      mkExercise("Lat pulldown","4 x 6-8"),
      mkExercise("Leg extension","3 x 8-10"),
      mkExercise("Leg curl","3 x 8-10"),
      mkExercise("Overhead triceps extension","3 x 8-10"),
      mkExercise("Incline / hammer curl","3 x 8-10"),
      mkExercise("Shrugs","3 x 10-12"),
      mkExercise("Calf raise (squat machine)","3 x 12-15"),
    ]},
  ]};
}

function makeThreeDayPlan(){
  return { id:uid(), name:"3-Day Plan", workouts:[
    { id:uid(), name:"Day A", exercises:[
      mkExercise("Leg press","4 x 6-8"),
      mkExercise("Chest press machine","4 x 6-8"),
      mkExercise("Seated row","4 x 6-8"),
      mkExercise("Lat pulldown","4 x 6-8"),
      mkExercise("Leg curl","3 x 8-10"),
      mkExercise("Single-arm cable rear-delt fly","3 x 10-15"),
    ]},
    { id:uid(), name:"Day B", exercises:[
      mkExercise("Leg press","4 x 6-8"),
      mkExercise("Incline dumbbell press","4 x 6-8"),
      mkExercise("Leg extension","3 x 8-10"),
      mkExercise("Lateral raise","3 x 10-12"),
      mkExercise("One-arm triceps pushdown","3 x 8-10"),
      mkExercise("Biceps curl (preacher/machine)","3 x 8-10"),
      mkExercise("Calf raise (squat machine)","3 x 12-15"),
    ]},
    { id:uid(), name:"Day C", exercises:[
      mkExercise("Seated row","4 x 6-8"),
      mkExercise("Lat pulldown","4 x 6-8"),
      mkExercise("Leg curl","3 x 8-10"),
      mkExercise("Overhead triceps extension","3 x 8-10"),
      mkExercise("Incline / hammer curl","3 x 8-10"),
      mkExercise("Shrugs","3 x 10-12"),
      mkExercise("Calf raise (squat machine)","3 x 12-15"),
    ]},
  ]};
}

function seed(){
  const three = makeThreeDayPlan();
  const two = makeTwoDayPlan();
  return {schema:SCHEMA, theme:"light", activePlanId:three.id, plans:[three,two]};
}

function normalizeExercise(ex){
  if(!ex.id) ex.id=uid();
  if(!Array.isArray(ex.sessions)) ex.sessions=[];
  if(!ex.linkGroup) ex.linkGroup=knownLinkGroup(ex.name) || inferredLinkGroup(ex.name,ex.id);
  return ex;
}
function normalizePlan(plan){
  if(!plan.id) plan.id=uid();
  if(!Array.isArray(plan.workouts)) plan.workouts=[];
  for(const w of plan.workouts){
    if(!w.id) w.id=uid();
    if(!Array.isArray(w.exercises)) w.exercises=[];
    w.exercises.forEach(normalizeExercise);
  }
  return plan;
}

function migrate(raw){
  if(raw && Array.isArray(raw.plans)){
    raw.schema=SCHEMA;
    raw.theme=raw.theme||"light";
    raw.plans.forEach(normalizePlan);
    if(!raw.activePlanId || !raw.plans.some(p=>p.id===raw.activePlanId)) raw.activePlanId=raw.plans[0]?.id||null;
    return raw;
  }
  if(raw && Array.isArray(raw.workouts)){
    const oldPlan={id:uid(), name:"2-Day Weekend Plan", workouts:raw.workouts};
    normalizePlan(oldPlan);
    const three=makeThreeDayPlan();
    return {schema:SCHEMA, theme:raw.theme||"light", activePlanId:three.id, plans:[three,oldPlan]};
  }
  return seed();
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    data = raw ? migrate(JSON.parse(raw)) : seed();
  }catch(e){
    storageOK = false;
    data = seed();
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ storageOK = false; }
}

/* ============================================================
   Notation parser
   one line per session; sets comma-separated; W-R;
   ~ or * = cheated reps; / = drop set; (…) = note; ? ; N/A
   ============================================================ */
function parseTarget(t){
  if(!t) return null;
  const m = t.match(/(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?/i);
  if(!m) return null;
  return { sets:+m[1], lo:+m[2], hi: m[3]? +m[3] : +m[2] };
}

function scanSets(raw){
  const body = raw.replace(/\([^)]*\)/g, " ");
  const out = [];
  const re = /(\d+(?:\.\d+)?)\s*([-~*])\s*(\d+)/g;
  let m;
  while((m = re.exec(body))) out.push({ w:+m[1], r:+m[3], cheat:(m[2]!=="-") });
  return out;
}

function sessionStats(raw){
  const sets = scanSets(raw);
  if(!sets.length) return null;
  let top = null, vol = 0;
  for(const s of sets){
    vol += s.w * s.r;
    if(top===null || s.w > top) top = s.w;
  }
  return { top, vol };
}

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderLineHTML(raw, target){
  const t = parseTarget(target);
  return esc(raw).replace(/\([^)]*\)|(\d+(?:\.\d+)?)\s*([-~*])\s*(\d+)/g,
    (m, w, sep, r)=>{
      if(w===undefined) return '<span class="note-tok">'+m+'</span>';
      let cls = "";
      if(t && +r < t.lo) cls = "set-low";
      else if(sep==="-" && t && +r>=t.hi) cls = "set-hit";
      let html = cls ? '<span class="'+cls+'">'+m+'</span>' : m;
      if(sep==="~") html += '<span class="ast">*</span>';
      return html;
    });
}

/* ============================================================
   State + navigation
   ============================================================ */
const state = {
  view:"home", workoutId:null,
  expanded:new Set(), graphFor:null, linkedFor:null, metric:"top",
  editingHistory:null, editingToday:null,
  cheat:false,
};
const $app = document.getElementById("app");

function activePlan(){ return data.plans.find(p=>p.id===data.activePlanId) || data.plans[0] || null; }
function findPlan(id){ return data.plans.find(p=>p.id===id); }
function findWorkout(id){
  for(const p of data.plans){ const w=(p.workouts||[]).find(x=>x.id===id); if(w) return w; }
  return null;
}
function findEx(w,id){ return w.exercises.find(e=>e.id===id); }

function todayISO(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"});
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"),1800);
}

function navSnapshot(){
  return {
    tlog:true, view:state.view, workoutId:state.workoutId,
    expanded:[...state.expanded], graphFor:state.graphFor, linkedFor:state.linkedFor,
    editingHistory:state.editingHistory, editingToday:state.editingToday, metric:state.metric
  };
}
function applySnapshot(s){
  if(!s || !s.tlog){ state.view="home"; state.workoutId=null; state.expanded.clear(); state.graphFor=null; state.linkedFor=null; state.editingHistory=null; state.editingToday=null; }
  else {
    state.view=s.view||"home"; state.workoutId=s.workoutId||null;
    state.expanded=new Set(s.expanded||[]); state.graphFor=s.graphFor||null; state.linkedFor=s.linkedFor||null;
    state.editingHistory=s.editingHistory||null; state.editingToday=s.editingToday||null; state.metric=s.metric||"top";
  }
}
function pushNav(){ history.pushState(navSnapshot(),""); }
function replaceNav(){ history.replaceState(navSnapshot(),""); }
function clearTransient(){ state.graphFor=null; state.linkedFor=null; state.editingHistory=null; state.editingToday=null; }
function prepareTransientBase(){
  if(state.graphFor || state.linkedFor || state.editingHistory || state.editingToday){
    clearTransient(); replaceNav();
  }
}
function openTransient(kind,id){
  prepareTransientBase();
  if(kind==="graph") state.graphFor=id;
  if(kind==="linked") state.linkedFor=id;
  if(kind==="history") state.editingHistory=id;
  if(kind==="today") state.editingToday=id;
  pushNav(); render();
}
function navToWorkout(id){
  state.view="workout"; state.workoutId=id; state.expanded.clear(); clearTransient();
  pushNav(); render();
}
function navToPlans(){
  state.view="plans"; state.workoutId=null; state.expanded.clear(); clearTransient();
  pushNav(); render();
}
function navBack(){ history.back(); }
window.addEventListener("popstate", e=>{ applySnapshot(e.state); render(); });

// Called by the Android wrapper for the system Back gesture/button.
// Return true when the web app handled Back internally; false means Android may exit.
window.trainingLogHandleAndroidBack = function(){
  if(state.graphFor || state.linkedFor || state.editingHistory || state.editingToday){
    clearTransient();
    replaceNav();
    render();
    return true;
  }
  if(state.view==="workout" || state.view==="plans"){
    state.view="home";
    state.workoutId=null;
    state.expanded.clear();
    clearTransient();
    replaceNav();
    render();
    return true;
  }
  return false;
};

function render(){
  save();
  if(state.view==="home") renderHome();
  else if(state.view==="plans") renderPlans();
  else renderWorkout();
}

/* ---------- home ---------- */
function renderHome(){
  const plan=activePlan();
  if(!plan){ data=seed(); return renderHome(); }
  let h = `<header><div><h1>Training Log</h1>
    <div class="sub">${esc(plan.name)} &nbsp;·&nbsp; weight-reps &nbsp;·&nbsp; ~ cheat &nbsp;·&nbsp; / drop</div></div>
    <span class="spacer"></span><button class="btn small ghost" data-act="plans">Plans</button></header>`;
  for(const w of plan.workouts){
    let last = null;
    for(const ex of w.exercises) for(const s of ex.sessions)
      if(s.date && (!last || s.date>last)) last = s.date;
    h += `<div class="card" data-open="${w.id}">
      <span class="chev">›</span><h2>${esc(w.name)}</h2>
      <div class="meta">${w.exercises.length} exercises${last? " · last logged "+fmtDate(last):""}</div>
    </div>`;
  }
  if(!plan.workouts.length) h += `<div class="empty-note" style="padding:8px 2px 14px">No workout days yet. Add one below.</div>`;
  h += `<div class="footer-tools">
    <button class="btn small" data-act="addWorkout">+ Workout</button>
    <button class="btn small ghost" data-act="export">Export backup</button>
    <button class="btn small ghost" data-act="import">Import</button>
    <button class="btn small ghost" data-act="copyText">Copy all as text</button>
    <button class="btn small ghost" data-act="theme">${data.theme==="dark"?"Light theme":"Dark theme"}</button>
  </div>
  <div class="legend">
    Notation: <span class="mono">weight-reps</span>, sets separated by commas.
    <span class="mono">~</span> or <span class="mono">*</span> marks cheated reps.
    <span class="mono">/</span> marks a drop set. <span class="mono">(…)</span> is a note.
    <span class="mono">?</span> not recorded, <span class="mono">N/A</span> skipped.<br>
    <span style="color:var(--hit)">Green</span> = clean set at the top of the rep range.
    <span style="color:var(--cheat)">Red</span> = below the range minimum.
    Cheated sets show a dim <span class="mono">*</span> after the set.
    ${storageOK? "" : "<br><b style='color:var(--cheat)'>Saving is unavailable in this environment — data will be lost when you close the page.</b>"}
  </div>`;
  $app.innerHTML = h;

  $app.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>navToWorkout(el.dataset.open));
  bindAct("plans",navToPlans);
  bindAct("addWorkout",()=>{
    const name = prompt("Workout name:"); if(!name) return;
    plan.workouts.push({id:uid(),name,exercises:[]}); render();
  });
  bindAct("export",exportJSON);
  bindAct("import",()=>document.getElementById("importFile").click());
  bindAct("copyText",()=>copyText(allAsText()));
  bindAct("theme",()=>{ data.theme = data.theme==="dark" ? "light" : "dark"; applyTheme(); render(); });
}

function bindAct(name,fn){
  $app.querySelectorAll(`[data-act="${name}"]`).forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();fn(el);});
}

/* ---------- plans ---------- */
function renderPlans(){
  let h=`<header><button class="back" data-act="back">‹ Back</button><div><h1>Plans</h1><div class="sub">Choose which plan appears on the main screen</div></div></header>`;
  for(const p of data.plans){
    const active=p.id===data.activePlanId;
    h += `<div class="plan-card">
      <div class="plan-title"><b>${esc(p.name)}</b>${active?'<span class="plan-badge">Active</span>':''}</div>
      <div class="meta">${p.workouts.length} workout${p.workouts.length===1?'':'s'}</div>
      <div class="plan-actions">
        <button class="btn small ${active?'ghost':'primary'}" data-planopen="${p.id}">${active?'Open':'Activate'}</button>
        <button class="btn small ghost" data-planrename="${p.id}">Rename</button>
        <button class="btn small ghost" data-plandupe="${p.id}">Duplicate</button>
        <button class="btn small ghost danger" data-plandelete="${p.id}">Delete</button>
      </div></div>`;
  }
  h += `<div class="footer-tools"><button class="btn small" data-act="addPlan">+ Plan</button></div>`;
  $app.innerHTML=h;
  bindAct("back",navBack);
  bindAct("addPlan",()=>{
    const name=prompt("Plan name:"); if(!name) return;
    const p={id:uid(),name,workouts:[]}; data.plans.push(p); data.activePlanId=p.id; save();
    state.view="home"; history.back();
  });
  $app.querySelectorAll("[data-planopen]").forEach(b=>b.onclick=()=>{
    data.activePlanId=b.dataset.planopen; save(); state.view="home"; history.back();
  });
  $app.querySelectorAll("[data-planrename]").forEach(b=>b.onclick=()=>{
    const p=findPlan(b.dataset.planrename); const n=prompt("Plan name:",p.name); if(n){p.name=n;render();}
  });
  $app.querySelectorAll("[data-plandupe]").forEach(b=>b.onclick=()=>{
    const src=findPlan(b.dataset.plandupe);
    const copy={id:uid(),name:"Copy of "+src.name,workouts:src.workouts.map(w=>({id:uid(),name:w.name,exercises:w.exercises.map(ex=>({id:uid(),name:ex.name,target:ex.target,linkGroup:ex.linkGroup,sessions:[]}))}))};
    data.plans.push(copy); render();
  });
  $app.querySelectorAll("[data-plandelete]").forEach(b=>b.onclick=()=>{
    if(data.plans.length<=1){toast("Keep at least one plan");return;}
    const p=findPlan(b.dataset.plandelete);
    if(confirm(`Delete "${p.name}" and all its history? This can't be undone.`)){
      data.plans=data.plans.filter(x=>x.id!==p.id);
      if(data.activePlanId===p.id) data.activePlanId=data.plans[0].id;
      render();
    }
  });
}

/* ---------- workout view ---------- */
function renderWorkout(){
  const w = findWorkout(state.workoutId);
  if(!w){ state.view="home"; replaceNav(); return renderHome(); }
  let h = `<header>
    <button class="back" data-act="back">‹ Back</button>
    <div><h1>${esc(w.name)}</h1><div class="sub">${todayLabel()}</div></div>
    <span class="spacer"></span><button class="btn small ghost" data-act="wMenu">⋯</button>
  </header>`;
  for(const ex of w.exercises) h += exerciseHTML(w,ex);
  h += `<div class="footer-tools" style="margin-top:14px">
    <button class="btn small" data-act="addEx">+ Exercise</button>
    <button class="btn small ghost" data-act="copyWorkout">Copy as text</button>
  </div>`;
  $app.innerHTML = h;

  bindAct("back",navBack);
  bindAct("addEx",()=>{
    const name = prompt("Exercise name:"); if(!name) return;
    const target = prompt("Target (e.g. 4 x 6-8):","3 x 8-10") || "";
    w.exercises.push({id:uid(),name,target,linkGroup:inferredLinkGroup(name),sessions:[]}); render();
  });
  bindAct("copyWorkout",()=>copyText(workoutAsText(w)));
  bindAct("wMenu",()=>{
    const c = prompt("Type: rename / delete","rename"); if(!c) return;
    if(c.toLowerCase().startsWith("r")){
      const n = prompt("New name:",w.name); if(n){ w.name=n; render(); }
    } else if(c.toLowerCase().startsWith("d")){
      if(confirm(`Delete "${w.name}" and all its history? This can't be undone.`)){
        const p=activePlan(); p.workouts=p.workouts.filter(x=>x.id!==w.id); navBack();
      }
    }
  });

  $app.querySelectorAll("[data-ex]").forEach(head=>{
    head.onclick = ()=>{
      const id = head.dataset.ex;
      if(state.expanded.has(id)){
        state.expanded.delete(id); if(state.graphFor===id) state.graphFor=null; if(state.linkedFor===id) state.linkedFor=null;
        if(state.editingHistory===id) state.editingHistory=null; if(state.editingToday===id) state.editingToday=null;
      } else state.expanded.add(id);
      replaceNav(); render();
    };
  });
  $app.querySelectorAll("[data-log]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();logSet(w,btn.dataset.log,false);});
  $app.querySelectorAll("[data-drop]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();logSet(w,btn.dataset.drop,true);});
  $app.querySelectorAll("[data-undo]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();undoSet(w,btn.dataset.undo);});
  $app.querySelectorAll("[data-note]").forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation(); const ex=findEx(w,btn.dataset.note); const n=prompt("Note (machine swap, etc.):"); if(!n)return;
    const s=todaySession(ex,true); s.raw=s.raw?s.raw+", ("+n+")":"("+n+")"; render();
  });
  $app.querySelectorAll("[data-cheat]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();state.cheat=!state.cheat;render();});
  $app.querySelectorAll("[data-graph]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();
    if(state.graphFor===btn.dataset.graph) navBack(); else openTransient("graph",btn.dataset.graph);
  });
  $app.querySelectorAll("[data-linked]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();
    if(state.linkedFor===btn.dataset.linked) navBack(); else openTransient("linked",btn.dataset.linked);
  });
  $app.querySelectorAll("[data-metric]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();state.metric=btn.dataset.metric;replaceNav();render();});
  $app.querySelectorAll("[data-edithist]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();openTransient("history",btn.dataset.edithist);});
  $app.querySelectorAll("[data-edittoday]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();openTransient("today",btn.dataset.edittoday);});
  $app.querySelectorAll("[data-exmenu]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();exMenu(w,btn.dataset.exmenu);});
  $app.querySelectorAll("[data-savehist]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();saveHistory(w,btn.dataset.savehist); history.back();});
  $app.querySelectorAll("[data-savetoday]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();saveToday(w,btn.dataset.savetoday); history.back();});
  $app.querySelectorAll("[data-cancel]").forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();navBack();});
}

function todayLabel(){ return new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }

function latestLinkedEntry(ex){
  if(!ex.linkGroup) return null;
  let best=null, order=0;
  for(const p of data.plans) for(const w of p.workouts) for(const other of w.exercises){
    if(other.id===ex.id || other.linkGroup!==ex.linkGroup) continue;
    for(const s of other.sessions){
      order++;
      if(!s.raw) continue;
      const key=s.date || "0000-00-00";
      if(!best || key>best.key || (key===best.key && order>best.order)) best={plan:p,workout:w,ex:other,session:s,key,order};
    }
  }
  return best;
}
function linkedPanelHTML(ex){
  const ref=latestLinkedEntry(ex);
  if(!ref) return `<div class="linked-panel"><div class="empty-note">No logged linked exercise yet.</div></div>`;
  return `<div class="linked-panel">
    <div class="linked-label">Latest linked · ${esc(ref.plan.name)} · ${esc(ref.workout.name)}${ref.session.date?" · "+fmtDate(ref.session.date):""}</div>
    <div class="mono hline">${renderLineHTML(ref.session.raw,ref.ex.target)}</div>
  </div>`;
}

function exerciseHTML(w,ex){
  const open = state.expanded.has(ex.id);
  const last = ex.sessions[ex.sessions.length-1] || null;
  let h = `<div class="ex"><div class="ex-head" data-ex="${ex.id}">
      <b>${esc(ex.name)}</b><span class="target">${esc(ex.target||"")}</span></div>`;
  if(!open){
    h += `<div class="latest mono">`;
    if(last) h += `<span class="date">${fmtDate(last.date)||"&nbsp;"}</span>${renderLineHTML(last.raw, ex.target)}`;
    else h += `<span class="empty-note">No entries yet</span>`;
    h += `</div></div>`; return h;
  }
  h += `<div class="hist mono">`;
  if(!ex.sessions.length) h += `<span class="empty-note">No entries yet — log your first set below. A new line starts automatically each day you train.</span>`;
  const today = todayISO();
  ex.sessions.forEach(s=>{
    const isToday = s.date===today;
    if(isToday && state.editingToday===ex.id){
      h += `<div class="editor" style="border:none;padding:6px 0"><textarea id="today-${ex.id}" rows="2">${esc(s.raw)}</textarea>
        <div class="row"><button class="btn small primary" data-savetoday="${ex.id}">Save line</button><button class="btn small ghost" data-cancel="1">Cancel</button></div></div>`;
    } else {
      h += `<div class="hline ${isToday?"today-row":""}"><span>${s.date?`<span class="d">${fmtDate(s.date)}</span>`:""}${renderLineHTML(s.raw, ex.target)}</span>${isToday?`<button class="pencil" data-edittoday="${ex.id}" title="Edit today's line">✎</button>`:""}</div>`;
    }
  });
  h += `</div>`;
  if(state.editingHistory===ex.id){
    h += `<div class="editor"><div class="hint">One line per session, oldest first, your usual notation. Existing dates are kept by line position; new lines have no date.</div>
      <textarea id="hist-${ex.id}" rows="${Math.max(4,ex.sessions.length+1)}">${esc(ex.sessions.map(s=>s.raw).join("\n"))}</textarea>
      <div class="row"><button class="btn small primary" data-savehist="${ex.id}">Save history</button><button class="btn small ghost" data-cancel="1">Cancel</button></div></div>`;
  }
  if(state.graphFor===ex.id) h += graphHTML(ex);
  h += `<div class="logger"><div class="row">
      <input type="number" inputmode="decimal" id="w-${ex.id}" placeholder="weight" step="any">
      <input type="number" inputmode="numeric" id="r-${ex.id}" placeholder="reps">
      <button class="toggle ${state.cheat?"on":""}" data-cheat="1" title="Mark set as cheated">~</button></div>
    <div class="row2"><button class="btn primary" data-log="${ex.id}">Add set</button><button class="btn" data-drop="${ex.id}" title="Append as drop set to last set">+ / drop</button><button class="btn ghost" data-undo="${ex.id}">Undo</button><button class="btn ghost" data-note="${ex.id}">( note )</button></div></div>`;
  if(state.linkedFor===ex.id) h += linkedPanelHTML(ex);
  const hasLinked=!!allExercises().find(x=>x.ex.id!==ex.id && x.ex.linkGroup===ex.linkGroup);
  h += `<div class="tools">
    <button class="btn small ghost" data-graph="${ex.id}">${state.graphFor===ex.id?"Hide graph":"Graph"}</button>
    ${hasLinked?`<button class="btn small ghost" data-linked="${ex.id}">${state.linkedFor===ex.id?"Hide linked":"Linked"}</button>`:""}
    <button class="btn small ghost" data-edithist="${ex.id}">Edit history</button>
    <button class="btn small ghost" data-exmenu="${ex.id}">⋯</button></div></div>`;
  return h;
}

/* ---------- logging ---------- */
function todaySession(ex, create){
  const today = todayISO();
  let s = ex.sessions.find(x=>x.date===today);
  if(!s && create){ s = {id:uid(), date:today, raw:""}; ex.sessions.push(s); }
  return s;
}
function logSet(w, exId, asDrop){
  const ex=findEx(w,exId); const wv=document.getElementById("w-"+exId).value.trim(); const rv=document.getElementById("r-"+exId).value.trim();
  if(!wv||!rv){toast("Enter weight and reps");return;}
  const setStr=wv+(state.cheat?"~":"-")+rv; const s=todaySession(ex,true);
  if(asDrop){
    const parts=s.raw.split(","); let idx=-1;
    for(let i=parts.length-1;i>=0;i--) if(/\d/.test(parts[i])&&!/^\s*\(.*\)\s*$/.test(parts[i])){idx=i;break;}
    if(idx===-1){toast("No set to drop from — add a set first");return;}
    parts[idx]=parts[idx].replace(/\s*$/ ,"")+"/"+setStr; s.raw=parts.join(",");
  } else s.raw=s.raw?s.raw+", "+setStr:setStr;
  state.cheat=false; render();
  const rEl=document.getElementById("r-"+exId); if(rEl)rEl.value="";
  const wEl=document.getElementById("w-"+exId); if(wEl)wEl.value=wv;
}
function undoSet(w, exId){
  const ex=findEx(w,exId), s=todaySession(ex,false); if(!s||!s.raw){toast("Nothing to undo today");return;}
  const parts=s.raw.split(",").map(x=>x.trim()).filter(Boolean); const last=parts[parts.length-1];
  if(last.includes("/")) parts[parts.length-1]=last.slice(0,last.lastIndexOf("/")); else parts.pop();
  s.raw=parts.join(", "); if(!s.raw) ex.sessions=ex.sessions.filter(x=>x.id!==s.id); render();
}
function saveToday(w, exId){
  const ex=findEx(w,exId), s=todaySession(ex,false), val=document.getElementById("today-"+exId).value.trim();
  if(s){ if(val)s.raw=val; else ex.sessions=ex.sessions.filter(x=>x.id!==s.id); }
  state.editingToday=null; save();
}
function saveHistory(w, exId){
  const ex=findEx(w,exId); const lines=document.getElementById("hist-"+exId).value.split("\n").map(l=>l.trim()).filter(Boolean); const old=ex.sessions;
  ex.sessions=lines.map((raw,i)=>({id:old[i]?old[i].id:uid(),date:old[i]?old[i].date:null,raw}));
  state.editingHistory=null; save(); toast("History saved");
}
function exMenu(w, exId){
  const ex=findEx(w,exId); const c=prompt("Type: rename / target / link / delete","rename"); if(!c)return; const cl=c.toLowerCase();
  if(cl.startsWith("r")){ const n=prompt("New name:",ex.name); if(n){ex.name=n;render();} }
  else if(cl.startsWith("t")){ const t=prompt("Target (e.g. 4 x 6-8):",ex.target); if(t!==null){ex.target=t;render();} }
  else if(cl.startsWith("l")){
    const n=prompt("Link to an existing exercise by exact name, or type none to unlink:",ex.name); if(!n)return;
    if(n.trim().toLowerCase()==="none") ex.linkGroup="custom_"+uid();
    else {
      const match=allExercises().find(x=>x.ex.id!==ex.id&&normName(x.ex.name)===normName(n));
      if(!match){toast("No matching exercise found");return;} ex.linkGroup=match.ex.linkGroup;
    }
    render();
  }
  else if(cl.startsWith("d")){ if(confirm(`Delete "${ex.name}" and its history?`)){w.exercises=w.exercises.filter(x=>x.id!==exId);render();} }
}

/* ---------- graph ---------- */
function graphHTML(ex){
  const pts=[]; ex.sessions.forEach(s=>{const st=sessionStats(s.raw);if(st)pts.push({x:pts.length,date:s.date,top:st.top,vol:st.vol});});
  let body;
  if(pts.length<2) body=`<div class="empty-note" style="padding:14px">Need at least two logged sessions to draw a graph.</div>`;
  else {
    const metric=state.metric, vals=pts.map(p=>metric==="top"?p.top:p.vol); const W=520,H=190,padL=44,padR=14,padT=14,padB=26;
    let min=Math.min(...vals),max=Math.max(...vals); if(min===max){min-=1;max+=1;} const span=max-min; min-=span*.08;max+=span*.08;
    const X=i=>padL+(W-padL-padR)*(pts.length===1?.5:i/(pts.length-1)); const Y=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
    const color=metric==="top"?"var(--accent)":"var(--blue)"; let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
    for(let g=0;g<=3;g++){const v=min+(max-min)*g/3,y=Y(v);svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${padL-6}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`;}
    const xl=idx=>pts[idx].date?fmtDate(pts[idx].date):"#"+(idx+1);
    [[0,"start"],[Math.floor((pts.length-1)/2),"middle"],[pts.length-1,"end"]].forEach(([i,a])=>{svg+=`<text x="${X(i)}" y="${H-8}" text-anchor="${a}">${xl(i)}</text>`;});
    const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(vals[i]).toFixed(1)).join(" "); svg+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`;
    pts.forEach((p,i)=>{svg+=`<circle cx="${X(i)}" cy="${Y(vals[i])}" r="3" fill="${color}"/>`;}); svg+=`</svg>`; body=svg;
  }
  return `<div class="graph-wrap"><div class="graph-tabs"><button class="gtab ${state.metric==="top"?"on":""}" data-metric="top">Top weight</button><button class="gtab ${state.metric==="vol"?"on":""}" data-metric="vol">Volume (Σ w×r)</button></div>${body}</div>`;
}

/* ---------- export / import / copy ---------- */
function exportJSON(){
  const json=JSON.stringify(data,null,2);
  if(window.AndroidBridge && typeof window.AndroidBridge.saveJson==="function"){
    try{
      const blob=new Blob([json],{type:"application/json"}); const fr=new FileReader();
      fr.onload=()=>{ const b64=String(fr.result).split(",")[1]; window.AndroidBridge.saveJson(b64); };
      fr.onerror=()=>toast("Backup failed"); fr.readAsDataURL(blob); return;
    }catch(e){ toast("Backup failed"); return; }
  }
  const blob=new Blob([json],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="training-log-"+todayISO()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Backup downloaded");
}
document.getElementById("importFile").addEventListener("change", function(){
  const f=this.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=migrate(JSON.parse(r.result));if(!d.plans)throw new Error("bad file");if(confirm("Replace all current data with this backup?")){data=d;state.view="home";state.workoutId=null;state.expanded.clear();clearTransient();replaceNav();render();toast("Imported");}}catch(e){toast("Couldn't read that file");}};
  r.readAsText(f); this.value="";
});
function workoutAsText(w){
  let out=w.name.toUpperCase()+":\n\n"; for(const ex of w.exercises){out+=ex.name+(ex.target?" "+ex.target:"")+"\n";out+=ex.sessions.map(s=>s.raw).join("\n")+(ex.sessions.length?"\n":"");out+="\n";} return out.trimEnd()+"\n";
}
function planAsText(p){ return p.name.toUpperCase()+"\n"+"=".repeat(p.name.length)+"\n\n"+p.workouts.map(workoutAsText).join("\n"); }
function allAsText(){ return data.plans.map(planAsText).join("\n\n"); }
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>fallbackCopy(txt)); else fallbackCopy(txt);
}
function fallbackCopy(txt){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Copied");}

/* ---------- boot ---------- */
function applyTheme(){
  const dark=data.theme==="dark"; document.body.dataset.theme=dark?"dark":""; const meta=document.querySelector('meta[name="theme-color"]'); if(meta)meta.content=dark?"#131417":"#edefe8";
}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
load(); applyTheme();
history.replaceState(navSnapshot(),"");
render();

</script>
